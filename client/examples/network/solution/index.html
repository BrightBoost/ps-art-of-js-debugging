<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Team day</title>
</head>
<body>
    <nav><a href="/examples/">Examples</a><span>Team day</span></nav>
    <main>
        <h1>Team skills day</h1>
        <img src="../hero.webp" loading="lazy" alt="Colourful abstract banner" width="1200" height="800" style="max-width:100%;height:auto">
        <p id="average"></p>
        <form id="feedback">
            <label for="message">What should we learn next?</label>
            <input id="message" name="message" required>
            <button class="btn" type="submit">Send feedback</button>
        </form>
        <p id="status" role="status"></p>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
